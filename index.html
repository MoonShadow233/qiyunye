<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>栖云野 Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Docsify 主题 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">

  <style>
    /* ===== 浅色主题配色 ===== */
    :root {
      --mc-green: #3c8527;
      --mc-green-dark: #2a5f1b;
      --mc-blue: #4a9eff;
      --mc-border: #c8ccd1;
      --mc-bg: #f6f7f9;
      --mc-bg-soft: #eaecf0;
      --mc-bg-card: #ffffff;
      --mc-text: #202122;
      --mc-text-soft: #54595d;
    }

    /* ===== 深色主题配色 ===== */
    html[data-theme="dark"] {
      --mc-green: #4caf50;
      --mc-green-dark: #66bb6a;
      --mc-blue: #64b5f6;
      --mc-border: #3a3f44;
      --mc-bg: #1a1d21;
      --mc-bg-soft: #23272b;
      --mc-bg-card: #2b3035;
      --mc-text: #e8eaed;
      --mc-text-soft: #9aa0a6;
    }

    body {
      background: var(--mc-bg);
      color: var(--mc-text);
      font-family: "Linux Libertine", Georgia, "Times New Roman", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.7;
      transition: background 0.3s, color 0.3s;
    }

    /* ===== 侧边栏 ===== */
    .sidebar {
      background: var(--mc-bg-soft);
      border-right: 1px solid var(--mc-border);
    }

    .sidebar .app-name {
      font-family: "Minecraft", "Microsoft YaHei", sans-serif;
      font-size: 20px;
      font-weight: bold;
      color: var(--mc-green-dark);
      letter-spacing: 1px;
      padding: 16px 0;
      border-bottom: 2px solid var(--mc-green);
      margin-bottom: 12px;
    }

    .sidebar .app-name-link {
      color: var(--mc-green-dark) !important;
    }

    .sidebar .search {
      margin-bottom: 12px;
      border-bottom: 1px solid var(--mc-border);
      padding-bottom: 8px;
    }

    .sidebar .search input {
      background: var(--mc-bg-card);
      border: 1px solid var(--mc-border);
      border-radius: 2px;
      padding: 6px 10px;
      font-size: 13px;
      color: var(--mc-text);
      width: 100%;
      box-sizing: border-box;
    }

    .sidebar .search input:focus {
      border-color: var(--mc-green);
      outline: none;
    }

    .sidebar-nav a {
      color: var(--mc-text-soft);
      font-size: 14px;
      padding: 4px 0;
      border-radius: 0;
      text-decoration: none;
    }

    .sidebar-nav a:hover {
      color: var(--mc-green-dark);
      background: rgba(76, 175, 80, 0.12);
      text-decoration: none;
    }

    .sidebar-nav > ul > li > p {
      cursor: pointer;
      font-weight: bold;
      color: var(--mc-text);
      margin-top: 14px;
      margin-bottom: 4px;
      padding: 6px 8px;
      font-size: 14px;
      border-bottom: 1px solid var(--mc-border);
      position: relative;
      user-select: none;
    }

    .sidebar-nav > ul > li > p::before {
      content: "▸";
      display: inline-block;
      margin-right: 6px;
      transition: transform 0.2s;
      color: var(--mc-green);
    }

    .sidebar-nav > ul > li.open > p::before {
      transform: rotate(90deg);
    }

    .sidebar-nav > ul > li > ul {
      padding-left: 12px;
    }

    .sidebar-nav > ul > li > ul > li > a {
      padding-left: 14px;
      border-left: 2px solid transparent;
      display: block;
    }

    .sidebar-nav > ul > li > ul > li.active > a {
      border-left: 2px solid var(--mc-green);
      color: var(--mc-green-dark);
      font-weight: bold;
    }

    /* ===== 正文区域 ===== */
    .content {
      padding-top: 20px;
    }

    .markdown-section {
      max-width: 900px;
      padding: 24px 32px;
      margin: 20px auto;
      background: var(--mc-bg-card);
      border: 1px solid var(--mc-border);
      border-radius: 2px;
      font-size: 15px;
      line-height: 1.8;
      color: var(--mc-text);
    }

    .markdown-section h1 {
      font-family: "Linux Libertine", Georgia, "Microsoft YaHei", serif;
      font-size: 28px;
      font-weight: normal;
      border-bottom: 1px solid var(--mc-border);
      padding-bottom: 6px;
      margin-bottom: 16px;
      color: var(--mc-text);
    }

    .markdown-section h2 {
      font-size: 22px;
      font-weight: normal;
      border-bottom: 1px solid var(--mc-border);
      padding-bottom: 4px;
      margin-top: 28px;
      margin-bottom: 12px;
      color: var(--mc-text);
    }

    .markdown-section h3 {
      font-size: 18px;
      font-weight: bold;
      margin-top: 22px;
      margin-bottom: 8px;
      color: var(--mc-text);
    }

    .markdown-section h4 {
      font-size: 16px;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 6px;
      color: var(--mc-text);
    }

    .markdown-section a {
      color: var(--mc-blue);
      text-decoration: none;
    }

    .markdown-section a:hover {
      text-decoration: underline;
    }

    .markdown-section code {
      background: var(--mc-bg-soft);
      border: 1px solid var(--mc-border);
      border-radius: 2px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      padding: 1px 5px;
      color: var(--mc-text);
    }

    .markdown-section pre {
      background: var(--mc-bg-soft);
      border: 1px solid var(--mc-border);
      border-radius: 2px;
      padding: 12px 16px;
      overflow-x: auto;
    }

    .markdown-section pre > code {
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
      color: var(--mc-text);
    }

    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
      font-size: 14px;
    }

    .markdown-section table th {
      background: var(--mc-bg-soft);
      border: 1px solid var(--mc-border);
      padding: 8px 12px;
      text-align: left;
      font-weight: bold;
    }

    .markdown-section table td {
      border: 1px solid var(--mc-border);
      padding: 8px 12px;
    }

    .markdown-section table tr:nth-child(even) {
      background: rgba(128, 128, 128, 0.06);
    }

    .markdown-section blockquote {
      border-left: 4px solid var(--mc-green);
      background: rgba(76, 175, 80, 0.08);
      padding: 10px 16px;
      margin: 12px 0;
      color: var(--mc-text-soft);
    }

    .markdown-section hr {
      border: none;
      border-top: 1px solid var(--mc-border);
      margin: 24px 0;
    }

    .markdown-section ul, .markdown-section ol {
      padding-left: 24px;
    }

    .markdown-section li {
      margin: 4px 0;
    }

    body .scrolltop {
      background: var(--mc-green);
      color: #fff;
    }

    /* ===== 主题切换按钮 ===== */
    #theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--mc-border);
      background: var(--mc-bg-card);
      color: var(--mc-text);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s, background 0.3s;
    }

    #theme-toggle:hover {
      transform: scale(1.1);
    }

    @media screen and (max-width: 768px) {
      .markdown-section {
        padding: 16px;
        margin: 10px;
      }
      .markdown-section h1 { font-size: 24px; }
      .markdown-section h2 { font-size: 20px; }
      #theme-toggle {
        top: 10px;
        right: 10px;
        width: 36px;
        height: 36px;
      }
    }
  </style>
</head>
<body>
  <button id="theme-toggle" title="切换深色/浅色">🌙</button>
  <div id="app"></div>

  <script>
    // ===== 主题切换 =====
    (function () {
      var saved = localStorage.getItem('wiki-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);

      function updateButton() {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
      }

      document.addEventListener('DOMContentLoaded', function () {
        updateButton();
        document.getElementById('theme-toggle').addEventListener('click', function () {
          var current = document.documentElement.getAttribute('data-theme');
          var next = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('wiki-theme', next);
          updateButton();
        });
      });

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (!localStorage.getItem('wiki-theme')) {
          document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
          updateButton();
        }
      });
    })();
  </script>

  <script>
    window.$docsify = {
      name: '栖云野 Wiki',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      autoHeader: true,
      homepage: 'README.md',
      notFoundPage: true,
      auto2top: true,
      copyCode: true,

      sidebarDisplayLevel: 1,

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索 Wiki...',
        noData: '找不到结果',
        depth: 3
      },

      sidebarCollapse: {},

      alias: {
        '/.*/sidebar.md': '/sidebar.md'
      },

      formatUpdated: '{YYYY}/{MM}/{DD} {HH}:{mm}',
      plugins: []
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
