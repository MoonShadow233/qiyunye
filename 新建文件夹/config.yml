# GuildPlugin 主配置文件

# 公会配置
guild:
  # 公会名称最短长度
  min-name-length: 3
  # 公会名称最长长度
  max-name-length: 20
  # 公会标签最长长度
  max-tag-length: 6
  # 公会描述最长长度
  max-description-length: 100
  # 每个公会的最大成员数
  max-members: 50
  # 创建公会所需费用（需要 Vault 经济插件）
  creation-cost: 5000.0
  # 传送回家等待秒数（0 = 即时，无延迟）
  home-teleport-delay: 0
  # 无经济模式：若设为 true，当未安装经济插件（如 Vault）时跳过经济检查
  no-economy-mode: false
  # 公会标签颜色
  tag-color: "&6"
  # 公会名称颜色
  name-color: "&e"
  # 等级系统配置
  # max-level: 最高等级（达到后不再升级）
  # levels: 升至下一级所需的资金（键 = 当前等级）
  max-level: 10
  levels:
    1: 5000.0
    2: 10000.0
    3: 20000.0
    4: 35000.0
    5: 50000.0
    6: 75000.0
    7: 100000.0
    8: 150000.0
    9: 200000.0

# 显示配置
display:
  # 身份组颜色（可自定义）
  role-colors:
    leader: "&6"    # 会长：金色
    officer: "&b"   # 官员：水蓝色
    member: "&7"    # 成员：灰色
  # 身份组分隔符配置
  role-separator:
    enabled: true
    text: " | "
    color-per-role: true      # 分隔符是否跟随身份组颜色
    default-color: "&7"       # 无身份组或不在公会时的默认颜色

# 权限配置
permissions:
  # 默认权限（未加入公会时的权限）
  default:
    can-create: true         # 允许创建公会（当未加入任何公会时）
    can-invite: false        # 非成员默认不能邀请
    can-kick: false          # 非成员默认不能踢人
    can-promote: false       # 非成员默认不能晋升
    can-demote: false        # 非成员默认不能降职
    can-delete: false        # 非成员默认不能解散公会
  
  # 会长权限（如未配置，则默认拥有全部权限）
  leader:
    can-create: true
    can-invite: true
    can-kick: true
    can-promote: true
    can-demote: true
    can-delete: true

  # 官员权限
  officer:
    can-create: true         # 允许进行副手操作及创建
    can-invite: true
    can-kick: true
    can-promote: false       # 是否允许晋升成员（通常仅会长可操作）
    can-demote: false        # 是否允许降职成员（通常仅会长可操作）
    can-delete: false        # 是否允许解散公会（通常仅会长可操作）
  
  # 成员权限
  member:
    can-create: true         # 允许退出后创建新公会
    can-invite: false
    can-kick: false
    can-promote: false
    can-demote: false
    can-delete: false

# 语言配置
language:
  # 默认语言（必须与 messages_xx.yml 中的语言代码一致）
  # 内置语言：en（英语）、zh（中文）、pl（波兰语）、br（巴西葡萄牙语）
  # 你可以通过放置对应的 messages_xx.yml 文件到插件目录来添加任意语言
  # 示例：要添加法语，请创建 messages_fr.yml 并将 default 设置为 "fr"
  default: "zh"
  # 是否允许玩家切换语言
  allow-player-switch: true
  # 附加语言列表（用于从插件数据文件夹或捆绑资源中按代码加载语言）
  # 插件会自动扫描数据目录下 lang/core/、lang/gui/ 和 lang/modules/ 中的语言文件
  # 此列表用于在启动时尝试加载这些语言。
  # 示例：["de", "fr", "es", "ja"]
  additional-languages: []

# 消息配置
messages:
  # 是否启用消息
  enabled: true
  # 消息前缀
  prefix: "&6[公会] &r"
  # 消息颜色
  colors:
    success: "&a"
    error: "&c"
    info: "&e"
    warning: "&6"

# GUI 配置
gui:
  # 是否启用 GUI
  enabled: true
  # GUI 标题
  title: "&b公会系统"
  # GUI 大小（必须是 9 的倍数）
  size: 54
  # 是否显示公会标签
  show-tag: true
  # 是否显示公会描述
  show-description: true

# 公会聊天配置
guild-chat:
  enabled: true
  format: "&7[&b公会&7]&r {role} {player}&f: {message}"
  role-leader: "&c&l会长"
  role-officer: "&6官员"
  role-member: "&a成员"
  offline-cache-size: 20
  allow-color-codes: true

# 占位符配置
placeholders:
  # 是否启用占位符
  enabled: true
  # 占位符前缀
  prefix: "guild_"
  # 是否缓存占位符
  cache-enabled: true
  # 缓存时间（秒）
  cache-time: 30

# 日志配置
logging:
  # 是否启用日志
  enabled: true
  # 日志级别：DEBUG、INFO、WARN、ERROR
  level: INFO
  # 是否记录到文件
  file-logging: true
  # 日志文件路径
  log-file: "logs/guild.log"
  # 单个日志文件最大大小（MB）
  max-file-size: 10
  # 保留的日志文件数量
  max-files: 5

# 开发者模式
developer-mode:
  # 启用开发者模式（使用自定义模块仓库时需要）
  enabled: false
  # 外部模块仓库（仅在开发者模式启用时生效）
  # 每个仓库需要唯一的名称（别名）和 API URL
  # 内置官方仓库始终可用且无法修改
  # 示例：
  # repositories:
  #   - name: "我的仓库"
  #     api: "https://api.github.com/repos/你的用户名/你的仓库/releases"
  #   - name: "社区仓库"
  #     api: "https://api.github.com/repos/社区/仓库/releases"
  repositories: []